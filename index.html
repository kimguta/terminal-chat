<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>C:\</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="terminal" id="terminal" aria-label="terminal chat">
        <div class="scanlines" aria-hidden="true"></div>
        <div class="crt-vignette" aria-hidden="true"></div>
        <div class="crt-glass" aria-hidden="true"></div>
        <button class="reset-button" id="resetButton" type="button" aria-label="reset">
          CLR
        </button>
        <div class="messages" id="messages" aria-live="polite"></div>
        <textarea
          class="keyboard-capture"
          id="keyboardCapture"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          aria-label="message"
        ></textarea>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
